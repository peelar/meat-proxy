# Every push to main whose tests and clippy pass releases the Mac app as a GitHub release, which installed copies
# update to within minutes while they run (src/update.rs). Pull requests run the same checks and release nothing.
#
#   meat-proxy-macos.zip   the ad-hoc signed app (./package.sh --zip)
#   install-mac.sh         its installer
#
# The version is Cargo.toml's while it has no release, else the next patch after the newest release: raise the
# version there for a minor or major release. A push that changes only docs or screenshots releases nothing.
# The release notes are the CHANGELOG.md section under "## Unreleased" (see CLAUDE.md).
name: Release

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "snapshots/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A release waits for this job, so a commit that fails its tests or clippy reaches no one.
  check:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal -c clippy && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: check-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  release:
    needs: check
    if: github.event_name != 'pull_request'
    # One release at a time, so two pushes never take the same version.
    concurrency:
      group: release
    permissions:
      contents: write
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        run: |
          base=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          newest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sed 's/^v//' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
          # The higher of the two; a release of it already made means the next patch.
          top=$(printf '%s\n%s\n' "$base" "${newest:-0.0.0}" | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
          if git rev-parse -q --verify "refs/tags/v$top" >/dev/null; then
            top=$(echo "$top" | awk -F. '{ printf "%d.%d.%d", $1, $2, $3 + 1 }')
          fi
          echo "tag=v$top" >> "$GITHUB_OUTPUT"
          echo "Releasing v$top"
      # The commits wrote their changelog lines under "## Unreleased". Name that section after the release and
      # keep it as the release notes; the last step commits the renamed heading back to main.
      - id: notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          : > notes.md
          if grep -q '^## Unreleased$' CHANGELOG.md; then
            version="${TAG#v}"
            sed -i.bak "s/^## Unreleased$/## $version/" CHANGELOG.md && rm CHANGELOG.md.bak
            awk -v h="## $version" '$0 == h { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > notes.md
          fi
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rune-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: ./package.sh --zip "${{ steps.version.outputs.tag }}" out
      # The tag is created at the commit that was built.
      - run: gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" $([ -s notes.md ] && echo "--notes-file notes.md" || echo "--generate-notes")
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
      # A markdown-only push, which releases nothing. After the build, so newer commits never join it.
      - run: |
          git diff --quiet CHANGELOG.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Release ${TAG#v} changelog" CHANGELOG.md
          git pull --rebase origin main
          git push origin HEAD:main
        env:
          TAG: ${{ steps.version.outputs.tag }}
