# Pushing a tag vX.Y.Z releases the Exact app (exact/) as GitHub release vX.Y.Z, which installed copies update to
# within the hour (scripts/install-web.sh, scripts/install-mac.sh):
#
#   meat-proxy-web-vX.Y.Z.tar.gz   the web app to run on your own computer (scripts/package.sh web)
#   install-web.sh                 its installer
#   meat-proxy-macos.zip           the ad-hoc signed Mac app (scripts/package.sh mac)
#   install-mac.sh                 its installer
#
# The OAuth app is the repository's OAUTH_CLIENT_ID and OAUTH_CLIENT_SECRET secrets (GitHub refuses secret names starting GITHUB_): the one whose callback is
# http://127.0.0.1/, which both parts sign in through.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release

jobs:
  package:
    strategy:
      matrix:
        include:
          - part: web
            runner: ubuntu-latest
          - part: mac
            # Exact's Mac host needs the macOS 26 SDK or newer.
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    env:
      EXACT: ${{ github.workspace }}/../exact
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup/toolchains
            ~/.cache/exact
          key: exact-${{ matrix.part }}-${{ runner.os }}-${{ hashFiles('exact/exact-rev') }}
      - run: sh scripts/setup.sh ${{ matrix.part }}
      - run: scripts/package.sh ${{ matrix.part }} "$GITHUB_REF_NAME" out
        env:
          GITHUB_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.part }}
          path: out/

  release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
